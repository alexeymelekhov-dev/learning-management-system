databaseChangeLog:
  - changeSet:
      id: 001-create-students
      author: Alexey
      changes:
        - createTable:
            tableName: students
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false